[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcritor-local"
version = "1.0.0"
description = "Transcrição de áudio e geração de legendas 100% offline com faster-whisper"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Weslei Sousa" }]
dependencies = ["faster-whisper>=1.0.3"]

[project.optional-dependencies]
web = ["gradio>=4.40"]
dev = ["pytest>=8"]

[project.scripts]
transcritor = "transcritor.cli:main"

[tool.setuptools]
packages = ["transcritor"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
